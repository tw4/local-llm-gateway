name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run build

  smoke:
    name: OpenAI SDK smoke test (Node + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install --quiet -r scripts/smoke/requirements.txt
      - run: npm run smoke

  image:
    name: Container image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t local-llm-gateway:ci .
      - name: Start the image and wait for /livez
        run: |
          printf 'backends:\n  ollama:\n    type: ollama\n    url: http://127.0.0.1:11434\nkeys:\n  - name: ci\n    key: ci-key-0123456789abcdef0123456789\n' > /tmp/config.yaml
          docker run -d --name gw --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 8080:8080 -v /tmp/config.yaml:/config/config.yaml:ro local-llm-gateway:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/livez && exit 0; sleep 1; done
          docker logs gw
          exit 1
