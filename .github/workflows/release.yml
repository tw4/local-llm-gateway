# Push a tag like v1.2.3 (matching package.json) to publish. Tests are not run here: run
# `npm run verify` locally before tagging (see docs/releasing.md).
#   * ghcr.io/<owner>/local-llm-gateway:1.2.3, :1.2, :1 and :latest (linux/amd64 + linux/arm64),
#     with an SBOM and build provenance
#   * a GitHub release whose notes are the version's section of CHANGELOG.md
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag matches package.json, and CHANGELOG.md has notes for it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          node scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=local-llm-gateway
            org.opencontainers.image.description=OpenAI-compatible gateway for self-hosted models: auth, aliases, rate limits, metrics
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # The backticks below are a Markdown code fence, not command substitution.
          # shellcheck disable=SC2016
          {
            cat "$RUNNER_TEMP/notes.md"
            printf '\n### Container image\n\n```sh\ndocker pull %s:%s\n```\n' "$IMAGE" "${TAG#v}"
          } > "$RUNNER_TEMP/body.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md" --verify-tag $prerelease
