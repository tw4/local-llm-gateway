# The gateway next to Ollama, with a chat and an embedding model pulled on first start.
#
#   echo "GATEWAY_API_KEY=$(openssl rand -hex 32)" > .env
#   docker compose up -d
#   curl http://localhost:8080/v1/chat/completions -H "Authorization: Bearer $GATEWAY_API_KEY" \
#     -H "Content-Type: application/json" -d '{"model":"chat-default","messages":[{"role":"user","content":"Hi"}]}'

services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    # Not published: only the gateway talks to Ollama.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # For an NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Pulls the models once, then exits.
  models:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$CHAT_MODEL\" && ollama pull \"$$EMBED_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:0.6b}
      EMBED_MODEL: ${EMBED_MODEL:-all-minilm}
    restart: "no"

  gateway:
    build: .
    image: local-llm-gateway:local
    depends_on:
      models:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env, e.g. with openssl rand -hex 32}"
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:0.6b}
      EMBED_MODEL: ${EMBED_MODEL:-all-minilm}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./docker/config.yaml:/config/config.yaml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  ollama:
